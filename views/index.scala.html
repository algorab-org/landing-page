@import com.algorabedu.landing.Translation
@(translation: Translation)

<head lang="@{translation.language}">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/public/output.css" />
  <title>@{translation("index.title")}</title>
</head>

<body>
  
  <div class="flex flex-grow flex-col items-center min-w-screen h-screen">
    <nav class="bg-slate-50 w-full">
      <div class="mx-auto max-w-7xl px-2 sm:px-6 lg:px-8">
        <div class="relative flex h-16 items-center justify-between">
          <div class="flex flex-1 items-center justify-start sm:items-stretch sm:justify-start">
            <div class="flex flex-shrink-0 items-center">
              <label class="text-3xl font-semibold text-indigo-700">Algorab</label>
            </div>
          </div>
          <div class="flex flex-1 items-center justify-end sm:items-stretch sm:justify-end">
            <div class="hidden sm:ml-6 sm:block justify-self-end">
              <div class="flex space-x-4">
                <!-- Current: "bg-gray-900 text-white", Default: "text-gray-300 hover:bg-gray-700 hover:text-white" -->
                <a href="#" class="rounded-md bg-indigo-700 px-3 py-2 text-sm font-medium text-white"
                  aria-current="page">Dashboard</a>
                <a href="#"
                  class="rounded-md px-3 py-2 text-sm font-medium text-indigo-700 hover:bg-indigo-400 hover:text-white">Team</a>
                <a href="#"
                  class="rounded-md px-3 py-2 text-sm font-medium text-indigo-700 hover:bg-indigo-400 hover:text-white">Projects</a>
                <a href="#"
                  class="rounded-md px-3 py-2 text-sm font-medium text-indigo-700 hover:bg-indigo-400 hover:text-white">Calendar</a>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Mobile menu, show/hide based on menu state. -->
      <div class="sm:hidden" id="mobile-menu">
        <div class="space-y-1 px-2 pb-3 pt-2">
          <!-- Current: "bg-gray-900 text-white", Default: "text-gray-300 hover:bg-gray-700 hover:text-white" -->
          <a href="#" class="block rounded-md bg-gray-900 px-3 py-2 text-base font-medium text-white"
            aria-current="page">Dashboard</a>
          <a href="#"
            class="block rounded-md px-3 py-2 text-base font-medium text-indigo-700 hover:bg-indigo-400 hover:text-white">Team</a>
          <a href="#"
            class="block rounded-md px-3 py-2 text-base font-medium text-indigo-700 hover:bg-indigo-400 hover:text-white">Projects</a>
          <a href="#"
            class="block rounded-md px-3 py-2 text-base font-medium text-indigo-700 hover:bg-indigo-400 hover:text-white">Calendar</a>
        </div>
      </div>
    </nav>
    <div class="flex flex-col flex-1 justify-center gap-5">
      <h1 class="text-center text-9xl font-bold mx-auto text-indigo-800">Algorab</h1>
      <label class="text-center text-6xl font-medium text-indigo-800">@{translation("index.slogan")}</label>
    </div>
  </div>
</body>
